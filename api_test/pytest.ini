[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    smoke: 冒烟用例，每次提交必跑
    negative: 异常/边界用例
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-5s %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
